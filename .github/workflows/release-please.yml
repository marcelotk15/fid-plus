name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Runs only on main (production). Commits arrive via merge commit from develop.
# Avoid duplicated release PRs when there are multiple pushes in a row on main.
concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
