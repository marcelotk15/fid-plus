name: Deploy Production

# Runs only when Release Please publishes an official GitHub Release.
on:
  release:
    types:
      - published

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy-production-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.10"

jobs:
  validate:
    name: Validate project
    uses: ./.github/workflows/_reusable-validate.yml
    with:
      bun-version: "1.3.10"
      ref: ${{ github.event.release.tag_name }}

  validate-release-version:
    name: Validate release version
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate tag version
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PACKAGE_VERSION=$(bun -e "console.log(require('./package.json').version)")

          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PACKAGE_VERSION"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version does not match package.json version"
            exit 1
          fi

  build-release:
    name: Build release package
    needs:
      - validate-release-version
    uses: ./.github/workflows/_reusable-build.yml
    with:
      bun-version: "1.3.10"
      ref: ${{ github.event.release.tag_name }}
      artifact-name: chrome-extension-zip
      upload-artifact: true

  publish-release:
    name: Publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build-release

    steps:
      - name: Download Chrome zip artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-zip
          path: .output

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: .output/${{ needs.build-release.outputs.zip-name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit-chrome-web-store:
    name: Submit to Chrome Web Store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build-release
      - publish-release

    environment:
      name: chrome-web-store

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Chrome zip artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-zip
          path: .output

      - name: Submit to Chrome Web Store
        run: bun wxt submit --chrome-zip ".output/${{ needs.build-release.outputs.zip-name }}"
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
