name: Deploy Production

on:
  release:
    types:
      - published

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.10"

jobs:
  validate:
    uses: ./.github/workflows/validate-project.yml

  build:
    name: Build release package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag version
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PACKAGE_VERSION=$(bun -e "console.log(require('./package.json').version)")

          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PACKAGE_VERSION"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version does not match package.json version"
            exit 1
          fi

      - name: Zip extension
        run: bun run zip

      - name: Find Chrome zip
        id: chrome_zip
        run: |
          ZIP=$(find .output -maxdepth 1 -type f -name "*-chrome.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Chrome zip not found in .output"
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.chrome_zip.outputs.zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Chrome zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-zip
          path: ${{ steps.chrome_zip.outputs.zip }}
          if-no-files-found: error
          retention-days: 7

  submit-chrome-web-store:
    name: Submit to Chrome Web Store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build

    environment:
      name: chrome-web-store

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Chrome zip artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-zip
          path: .output

      - name: Find Chrome zip
        id: chrome_zip
        run: |
          ZIP=$(find .output -maxdepth 1 -type f -name "*-chrome.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Chrome zip not found in .output"
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Submit to Chrome Web Store
        run: bun wxt submit --chrome-zip "${{ steps.chrome_zip.outputs.zip }}"
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
