name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate project
    uses: ./.github/workflows/_reusable-validate.yml
    with:
      bun-version: "1.3.10"

  integration-meta:
    name: Prepare integration version
    needs:
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      extension-version-name: ${{ steps.version.outputs.name }}
    steps:
      - id: version
        run: echo "name=develop-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-integration:
    name: Build integration package
    needs:
      - integration-meta
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/_reusable-build.yml
    with:
      bun-version: "1.3.10"
      extension-version-name: ${{ needs.integration-meta.outputs.extension-version-name }}
      artifact-name: chrome-extension-develop-${{ github.run_number }}
      upload-artifact: true
